<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 2026 世界杯下注管理系统 (历史留存清账版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                <span>🏆</span> 2026世界杯下注账目看板
            </h1>
            <span class="bg-green-500 text-xs px-3 py-1 rounded-full font-semibold">小赌怡情，理性看球</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <section class="grid grid-cols-3 gap-3 md:gap-4 overflow-x-auto whitespace-nowrap">
            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-xs border border-gray-100 flex flex-col justify-between min-w-[110px]">
                <div>
                    <p class="text-[10px] md:text-sm text-gray-500 font-medium truncate">本周应收/应付 (未清账目)</p>
                    <p id="weekly-p&l" class="text-sm md:text-2xl font-black text-gray-700 mt-1 md:mt-2">RM 0.00</p>
                </div>
                <div class="mt-2 md:mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-1 text-[9px] md:text-xs text-gray-400">
                    <span class="truncate text-red-500 font-medium" id="clearing-status">待结账</span>
                    <button onclick="clearWeekly()" class="bg-slate-950 text-white px-1.5 py-0.5 md:px-2 md:py-1 rounded-md hover:bg-slate-800 cursor-pointer text-center text-[9px] md:text-xs w-fit font-bold">周一清账</button>
                </div>
            </div>

            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-xs border border-gray-100 flex flex-col justify-between min-w-[110px]">
                <div>
                    <p class="text-[10px] md:text-sm text-gray-500 font-medium truncate">历史累计净损益 (不归零)</p>
                    <p id="total-p&l" class="text-sm md:text-2xl font-black text-gray-700 mt-1 md:mt-2">RM 0.00</p>
                </div>
                <p id="total-stats" class="text-[9px] md:text-xs text-gray-400 mt-2 md:mt-4 truncate">暂无数据</p>
            </div>

            <div class="bg-white p-4 md:p-5 rounded-2xl shadow-xs border border-gray-100 flex flex-col justify-between min-w-[110px]">
                <div>
                    <p class="text-[10px] md:text-sm text-gray-500 font-medium truncate">今日损益</p>
                    <p id="today-p&l" class="text-sm md:text-2xl font-black text-gray-700 mt-1 md:mt-2">RM 0.00</p>
                </div>
                <p class="text-[9px] md:text-xs text-gray-400 mt-2 md:mt-4 truncate">按今天下注统计</p>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-xs border border-gray-100">
            <h2 class="text-base font-bold text-gray-900 mb-4 flex items-center gap-2">
                <span class="w-2 h-4 bg-blue-600 rounded-xs"></span>快速记录新注单
            </h2>
            <form id="bet-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">比赛场次 (保存后名字会保留)</label>
                        <input type="text" id="match" placeholder="如: 葡萄牙 vs 荷兰" required class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">玩法分类</label>
                        <select id="play-type" onchange="togglePlayType(this.value)" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-blue-500">
                            <option value="普通玩法">普通玩法 (让球 / 大小 / 独赢)</option>
                            <option value="波胆/其他">波胆 / 其他玩法 (支持一次进3个比分)</option>
                        </select>
                    </div>
                    <div id="normal-direction-block">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">下注方向 / 队伍</label>
                        <input type="text" id="direction" placeholder="如: 葡萄牙 -0.5" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-blue-500">
                    </div>
                </div>

                <div id="normal-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">赌注 (本金) RM</label>
                        <input type="number" id="stake" placeholder="RM" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">赔率</label>
                        <input type="number" step="0.01" id="odds" placeholder="如: 0.95" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:outline-blue-500">
                    </div>
                </div>

                <div id="bodan-inputs" class="hidden p-4 bg-blue-50/50 border border-blue-100 rounded-xl space-y-3">
                    <p class="text-xs font-bold text-blue-700">🎯 请输入波胆组合：</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white p-3 rounded-lg border border-gray-200 space-y-2">
                            <span class="text-xs font-bold text-gray-400">选项 #1</span>
                            <input type="text" id="bd-dir-1" placeholder="预测比分" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" id="bd-stake-1" placeholder="本金 RM" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" step="0.01" id="bd-odds-1" placeholder="赔率" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                        </div>
                        <div class="bg-white p-3 rounded-lg border border-gray-200 space-y-2">
                            <span class="text-xs font-bold text-gray-400">选项 #2</span>
                            <input type="text" id="bd-dir-2" placeholder="预测比分" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" id="bd-stake-2" placeholder="本金 RM" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" step="0.01" id="bd-odds-2" placeholder="赔率" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                        </div>
                        <div class="bg-white p-3 rounded-lg border border-gray-200 space-y-2">
                            <span class="text-xs font-bold text-gray-400">选项 #3</span>
                            <input type="text" id="bd-dir-3" placeholder="预测比分" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" id="bd-stake-3" placeholder="本金 RM" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                            <input type="number" step="0.01" id="bd-odds-3" placeholder="赔率" class="w-full text-xs bg-gray-50 border border-gray-200 rounded p-2">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="w-full md:w-44 bg-blue-600 text-white font-bold text-sm rounded-lg p-3 hover:bg-blue-700 transition cursor-pointer">
                        保存记录
                    </button>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-base font-bold text-gray-900 flex items-center gap-2">
                    <span class="w-2 h-4 bg-emerald-500 rounded-xs"></span>下注与赛果明细
                </h2>
                <span class="text-xs text-blue-600 font-medium">✏️ 可随时直接手改“比分”和“状态”</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap text-sm">
                    <thead>
                        <tr class="bg-gray-50 text-gray-400 font-semibold border-b border-gray-100 text-xs">
                            <th class="p-4">下注日期</th>
                            <th class="p-4">比赛场次</th>
                            <th class="p-4">玩法</th>
                            <th class="p-4">方向</th>
                            <th class="p-4 text-right">赌注</th>
                            <th class="p-4">赔率</th>
                            <th class="p-4 text-center" style="width: 140px;">赛果</th>
                            <th class="p-4" style="width: 140px;">状态管理</th>
                            <th class="p-4 text-right">损益 (P&L)</th>
                            <th class="p-4 font-center text-center">清账状态</th>
                            <th class="p-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="bet-table-body" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 升级存储版本，防冲突
        let bets = JSON.parse(localStorage.getItem('wc_bets_v5')) || [];

        // 兼容旧数据导入
        if(bets.length === 0 && localStorage.getItem('wc_bets_v4')) {
            bets = JSON.parse(localStorage.getItem('wc_bets_v4'));
            bets.forEach(b => { if(b.cleared === undefined) b.cleared = false; });
        }

        function togglePlayType(type) {
            const normalInputs = document.getElementById('normal-inputs');
            const bodanInputs = document.getElementById('bodan-inputs');
            const normalDirection = document.getElementById('normal-direction-block');
            
            if (type === '波胆/其他') {
                normalInputs.classList.add('hidden');
                normalDirection.classList.add('hidden');
                bodanInputs.classList.remove('hidden');
                document.getElementById('direction').removeAttribute('required');
                document.getElementById('stake').removeAttribute('required');
                document.getElementById('odds').removeAttribute('required');
            } else {
                normalInputs.classList.remove('hidden');
                normalDirection.classList.remove('hidden');
                bodanInputs.classList.add('hidden');
                document.getElementById('direction').setAttribute('required', '');
                document.getElementById('stake').setAttribute('required', '');
                document.getElementById('odds').setAttribute('required', '');
            }
        }

        document.getElementById('bet-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const now = new Date();
            const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const matchName = document.getElementById('match').value;
            const playType = document.getElementById('play-type').value;

            if (playType === '波胆/其他') {
                for (let i = 1; i <= 3; i++) {
                    const dir = document.getElementById(`bd-dir-${i}`).value.trim();
                    const stake = parseFloat(document.getElementById(`bd-stake-${i}`).value);
                    const odds = parseFloat(document.getElementById(`bd-odds-${i}`).value);

                    if (dir && !isNaN(stake) && !isNaN(odds)) {
                        bets.unshift({
                            id: Date.now() + i,
                            date: dateStr,
                            match: matchName,
                            type: '波胆/其他',
                            direction: `波胆: ${dir}`,
                            stake: stake,
                            odds: odds,
                            score: '',
                            status: '未结算',
                            cleared: false // ⭐ 新增：未清账状态
                        });
                    }
                }
                for(let i=1; i<=3; i++) {
                    document.getElementById(`bd-dir-${i}`).value = '';
                    document.getElementById(`bd-stake-${i}`).value = '';
                    document.getElementById(`bd-odds-${i}`).value = '';
                }
            } else {
                bets.unshift({
                    id: Date.now(),
                    date: dateStr,
                    match: matchName,
                    type: document.getElementById('play-type').value,
                    direction: document.getElementById('direction').value,
                    stake: parseFloat(document.getElementById('stake').value),
                    odds: parseFloat(document.getElementById('odds').value),
                    score: '',
                    status: '未结算',
                    cleared: false // ⭐ 新增：未清账状态
                });
            }

            saveAndRender();
            document.getElementById('direction').value = '';
            document.getElementById('stake').value = '';
            document.getElementById('odds').value = '';
        });

        function updateScore(id, newScore) {
            const bet = bets.find(b => b.id === id);
            if (bet) {
                bet.score = newScore;
                localStorage.setItem('wc_bets_v5', JSON.stringify(bets));
                recalculateTotals(); 
            }
        }

        function updateStatus(id, newStatus) {
            const bet = bets.find(b => b.id === id);
            if (bet) {
                bet.status = newStatus;
                saveAndRender();
            }
        }

        function deleteBet(id) {
            if(confirm('确定要彻底删除这笔记录吗？')) {
                bets = bets.filter(b => b.id !== id);
                saveAndRender();
            }
        }

        // ⭐ 核心优化：只归档，不删记录
        function clearWeekly() {
            // 检查是否有未结算的比赛
            const hasPending = bets.some(b => !b.cleared && b.status === '未结算');
            let confirmMsg = '确定要把当前所有【已结算】的注单算清并归档吗？\n\n(注单会保留在下方历史明细中，但本周账目会重置归零)';
            if(hasPending) {
                confirmMsg = '⚠️ 注意：你还有比赛处于【未结算】状态！\n清账只会把已经算出结果的单子归档，还没打完的比赛会留在本周继续算。\n\n确定要结账吗？';
            }

            if(confirm(confirmMsg)) {
                bets.forEach(bet => {
                    if (bet.status !== '未结算') {
                        bet.cleared = true; // 把所有有结果的单子锁定为“已清账”
                    }
                });
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('wc_bets_v5', JSON.stringify(bets));
            renderDashboard();
        }

        function recalculateTotals() {
            let totalPl = 0;     // 历史总损益 (不归零)
            let weeklyPl = 0;    // 本周未清账损益 (周一清账归零)
            let todayPl = 0;     // 今日损益
            let winCount = 0;
            let loseCount = 0;
            const todayStr = `${String(new Date().getMonth()+1).padStart(2,'0')}/${String(new Date().getDate()).padStart(2,'0')}`;

            bets.forEach(bet => {
                let pl = 0;
                if (bet.status === '全赢') {
                    if (bet.type === '波胆/其他') {
                        pl = (bet.stake * bet.odds) - bet.stake;
                    } else {
                        pl = bet.stake * bet.odds;
                    }
                    winCount++;
                } else if (bet.status === '全输') {
                    pl = -bet.stake;
                    loseCount++;
                }

                // 累加历史总账
                totalPl += pl;
                
                // 如果这笔单子【还没有清账】，就计入本周对账金额
                if (!bet.cleared) {
                    weeklyPl += pl;
                }
                
                // 今日损益
                if (bet.date.startsWith(todayStr)) {
                    todayPl += pl;
                }

                // 更新单行UI
                const plTd = document.getElementById(`pl-${bet.id}`);
                if(plTd) {
                    if(bet.status === '未结算') {
                        plTd.innerText = '--';
                        plTd.className = 'p-4 text-right font-mono text-gray-400';
                    } else {
                        plTd.innerText = `${pl >= 0 ? '+' : '-'}RM ${Math.abs(pl).toFixed(2)}`;
                        plTd.className = `p-4 text-right font-mono ${pl > 0 ? 'text-green-600 font-bold' : (pl < 0 ? 'text-red-600 font-bold' : 'text-gray-400')}`;
                    }
                }
            });

            // 渲染看板
            document.getElementById('weekly-p&l').innerText = `${weeklyPl >= 0 ? '+' : '-'}RM ${Math.abs(weeklyPl).toFixed(2)}`;
            document.getElementById('weekly-p&l').className = `text-sm md:text-2xl font-black mt-1 md:mt-2 ${weeklyPl > 0 ? 'text-green-600' : (weeklyPl < 0 ? 'text-red-600' : 'text-gray-700')}`;

            document.getElementById('total-p&l').innerText = `${totalPl >= 0 ? '+' : '-'}RM ${Math.abs(totalPl).toFixed(2)}`;
            document.getElementById('total-p&l').className = `text-sm md:text-2xl font-black mt-1 md:mt-2 ${totalPl >= 0 ? 'text-green-600' : 'text-red-600'}`;
            
            document.getElementById('today-p&l').innerText = `${todayPl >= 0 ? '+' : '-'}RM ${Math.abs(todayPl).toFixed(2)}`;
            document.getElementById('today-p&l').className = `text-sm md:text-2xl font-black mt-1 md:mt-2 ${todayPl >= 0 ? 'text-green-600' : 'text-red-600'}`;

            const totalCount = winCount + loseCount;
            const winRate = totalCount > 0 ? ((winCount / totalCount) * 100).toFixed(1) : 0;
            document.getElementById('total-stats').innerText = `胜率: ${winRate}% (${winCount}赢 / ${loseCount}输)`;
        }

        function renderDashboard() {
            const tbody = document.getElementById('bet-table-body');
            tbody.innerHTML = '';
            
            bets.forEach(bet => {
                const tr = document.createElement('tr');
                // 如果已经清账，背景稍微变淡一些，方便肉眼区分新老账单
                tr.className = bet.cleared ? 'bg-gray-50/70 hover:bg-gray-100 transition' : 'hover:bg-gray-50 transition';
                
                const statusOptions = ['未结算', '全赢', '全输', '走水'].map(opt => {
                    return `<option value="${opt}" ${bet.status === opt ? 'selected' : ''}>${opt}</option>`;
                }).join('');

                // 清账状态小标签
                const clearBadge = bet.cleared 
                    ? '<span class="text-gray-400 bg-gray-200/60 text-[10px] px-2 py-0.5 rounded-sm font-medium">已结清</span>' 
                    : '<span class="text-red-600 bg-red-50 text-[10px] px-2 py-0.5 rounded-sm font-bold">待对账</span>';

                tr.innerHTML = `
                    <td class="p-4 text-gray-500 text-xs">${bet.date}</td>
                    <td class="p-4 font-semibold text-gray-900">${bet.match}</td>
                    <td class="p-4"><span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded">${bet.type}</span></td>
                    <td class="p-4 font-medium text-slate-700">${bet.direction}</td>
                    <td class="p-4 text-right font-mono">${bet.stake.toFixed(2)}</td>
                    <td class="p-4 font-mono text-gray-500">${bet.odds.toFixed(2)}</td>
                    <td class="p-4 text-center">
                        <input type="text" value="${bet.score}" oninput="updateScore(${bet.id}, this.value)" placeholder="比分" class="w-20 text-center text-xs font-bold font-mono bg-gray-50 border border-gray-200 rounded py-1 focus:outline-blue-500 focus:bg-white">
                    </td>
                    <td class="p-4">
                        <select onchange="updateStatus(${bet.id}, this.value)" class="text-xs font-bold rounded p-1 border border-gray-200 focus:outline-none bg-white">
                            ${statusOptions}
                        </select>
                    </td>
                    <td class="p-4 text-right font-mono" id="pl-${bet.id}">--</td>
                    <td class="p-4 text-center">${clearBadge}</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteBet(${bet.id})" class="text-red-500 hover:text-red-700 text-xs cursor-pointer">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            recalculateTotals();
        }

        togglePlayType('普通玩法');
        renderDashboard();
    </script>
</body>
</html>
